[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlearn-importer"
version = "0.1.0"
description = "VLearn structured content importer, deployed on AWS EC2 with systemd"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7,<0.8",
    "openpyxl>=3.1,<3.2",
    "python-docx>=1.2,<1.3",
]

[project.optional-dependencies]
extract = [
    "pymupdf>=1.26,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlearn_importer = ["import-formats.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
