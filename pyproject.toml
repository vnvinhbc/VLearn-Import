[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlearn-importer"
version = "0.1.0"
description = "VLearn TOEIC importer bootstrap, deployed on AWS EC2 with systemd"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
extract = [
    "pymupdf>=1.26,<2",
    "python-docx>=1.2,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
